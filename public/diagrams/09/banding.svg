<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" font-family="ui-sans-serif, system-ui, sans-serif">
  <rect width="1200" height="760" fill="#ffffff"/>
  <text x="60" y="60" font-size="30" font-weight="700" fill="#18181b">Audit log dan application log</text>
  <text x="60" y="92" font-size="16" fill="#71717a">Dua catatan berbeda. Jangan dicampur dalam satu tabel.</text>

  <rect x="60" y="130" width="520" height="540" rx="16" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
  <text x="88" y="176" font-size="21" font-weight="700" fill="#1d4ed8">Audit log</text>
  <text x="88" y="204" font-size="14" fill="#475569">menjawab siapa melakukan apa</text>

  <g font-size="15" fill="#0f172a">
    <text x="88" y="262" font-weight="700">Tujuan</text>
    <text x="248" y="262" fill="#475569">investigasi dan bukti</text>
    <line x1="88" y1="282" x2="552" y2="282" stroke="#bfdbfe"/>
    <text x="88" y="318" font-weight="700">Isi</text>
    <text x="248" y="318" fill="#475569">aktor, aksi, target, hasil</text>
    <line x1="88" y1="338" x2="552" y2="338" stroke="#bfdbfe"/>
    <text x="88" y="374" font-weight="700">Sifat</text>
    <text x="248" y="374" fill="#475569">append-only, tidak diubah</text>
    <line x1="88" y1="394" x2="552" y2="394" stroke="#bfdbfe"/>
    <text x="88" y="430" font-weight="700">Akses</text>
    <text x="248" y="430" fill="#475569">admin dan auditor</text>
    <line x1="88" y1="450" x2="552" y2="450" stroke="#bfdbfe"/>
    <text x="88" y="486" font-weight="700">Retensi</text>
    <text x="248" y="486" fill="#475569">lama, sesuai kebijakan</text>
  </g>

  <rect x="620" y="130" width="520" height="540" rx="16" fill="#f8fafc" stroke="#94a3b8" stroke-width="2"/>
  <text x="648" y="176" font-size="21" font-weight="700" fill="#334155">Application log</text>
  <text x="648" y="204" font-size="14" fill="#64748b">menjawab sistem sedang apa</text>

  <g font-size="15" fill="#0f172a">
    <text x="648" y="262" font-weight="700">Tujuan</text>
    <text x="808" y="262" fill="#64748b">debug dan monitoring</text>
    <line x1="648" y1="282" x2="1112" y2="282" stroke="#e2e8f0"/>
    <text x="648" y="318" font-weight="700">Isi</text>
    <text x="808" y="318" fill="#64748b">error, stack trace, performa</text>
    <line x1="648" y1="338" x2="1112" y2="338" stroke="#e2e8f0"/>
    <text x="648" y="374" font-weight="700">Sifat</text>
    <text x="808" y="374" fill="#64748b">boleh rotasi dan dihapus</text>
    <line x1="648" y1="394" x2="1112" y2="394" stroke="#e2e8f0"/>
    <text x="648" y="430" font-weight="700">Akses</text>
    <text x="808" y="430" fill="#64748b">developer dan ops</text>
    <line x1="648" y1="450" x2="1112" y2="450" stroke="#e2e8f0"/>
    <text x="648" y="486" font-weight="700">Retensi</text>
    <text x="808" y="486" fill="#64748b">pendek, biasanya harian</text>
  </g>
</svg>
