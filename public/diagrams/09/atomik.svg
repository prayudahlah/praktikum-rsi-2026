<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" font-family="ui-sans-serif, system-ui, sans-serif">
  <rect width="1200" height="760" fill="#ffffff"/>
  <text x="60" y="60" font-size="30" font-weight="700" fill="#18181b">Mutasi dan audit dalam satu transaksi</text>
  <text x="60" y="92" font-size="16" fill="#71717a">Tidak boleh ada mutasi tersimpan tanpa jejak audit.</text>

  <rect x="60" y="140" width="300" height="96" rx="14" fill="#f8fafc" stroke="#cbd5e1" stroke-width="2"/>
  <text x="82" y="178" font-size="17" font-weight="700" fill="#0f172a">BEGIN TRANSACTION</text>
  <text x="82" y="204" font-size="13" fill="#64748b">satu koneksi, satu transaksi</text>

  <rect x="450" y="140" width="300" height="96" rx="14" fill="#f8fafc" stroke="#cbd5e1" stroke-width="2"/>
  <text x="472" y="178" font-size="17" font-weight="700" fill="#0f172a">Mutasi bisnis</text>
  <text x="472" y="204" font-size="13" fill="#64748b">menu, order, atau status</text>

  <rect x="840" y="140" width="300" height="96" rx="14" fill="#f8fafc" stroke="#cbd5e1" stroke-width="2"/>
  <text x="862" y="178" font-size="17" font-weight="700" fill="#0f172a">INSERT AUDIT_LOGS</text>
  <text x="862" y="204" font-size="13" fill="#64748b">request dari transaksi yang sama</text>

  <line x1="360" y1="188" x2="445" y2="188" stroke="#94a3b8" stroke-width="2"/>
  <path d="M445 188 l-10 -5 v10 z" fill="#94a3b8"/>
  <line x1="750" y1="188" x2="835" y2="188" stroke="#94a3b8" stroke-width="2"/>
  <path d="M835 188 l-10 -5 v10 z" fill="#94a3b8"/>

  <rect x="840" y="320" width="300" height="96" rx="14" fill="#f0fdf4" stroke="#16a34a" stroke-width="2"/>
  <text x="862" y="358" font-size="17" font-weight="700" fill="#15803d">COMMIT</text>
  <text x="862" y="384" font-size="13" fill="#4b5563">keduanya tersimpan</text>

  <rect x="840" y="480" width="300" height="96" rx="14" fill="#fef2f2" stroke="#dc2626" stroke-width="2"/>
  <text x="862" y="518" font-size="17" font-weight="700" fill="#b91c1c">ROLLBACK</text>
  <text x="862" y="544" font-size="13" fill="#4b5563">keduanya batal</text>

  <line x1="990" y1="236" x2="990" y2="315" stroke="#16a34a" stroke-width="2"/>
  <path d="M990 315 l-5 -10 h10 z" fill="#16a34a"/>
  <text x="1004" y="282" font-size="13" fill="#15803d">sukses</text>

  <line x1="1140" y1="188" x2="1170" y2="188" stroke="#94a3b8" stroke-width="2"/>
  <line x1="1170" y1="188" x2="1170" y2="528" stroke="#dc2626" stroke-width="2"/>
  <line x1="1170" y1="528" x2="1145" y2="528" stroke="#dc2626" stroke-width="2"/>
  <path d="M1145 528 l10 -5 v10 z" fill="#dc2626"/>
  <text x="1050" y="450" font-size="13" fill="#b91c1c">audit gagal</text>

  <rect x="60" y="320" width="720" height="256" rx="14" fill="#fffbeb" stroke="#f59e0b" stroke-width="2"/>
  <text x="84" y="360" font-size="17" font-weight="700" fill="#92400e">Aturan praktis</text>
  <text x="84" y="398" font-size="15" fill="#78350f">1. Audit mutasi wajib ikut transaksi yang sama.</text>
  <text x="84" y="430" font-size="15" fill="#78350f">2. Jangan menulis audit setelah commit.</text>
  <text x="84" y="462" font-size="15" fill="#78350f">3. Login dan logout best-effort: gagal audit tidak</text>
  <text x="100" y="484" font-size="15" fill="#78350f">boleh mengunci pengguna, tetapi dicatat di log server.</text>
  <text x="84" y="524" font-size="15" fill="#78350f">4. Satu repository menerima objek transaksi yang sama.</text>
</svg>
