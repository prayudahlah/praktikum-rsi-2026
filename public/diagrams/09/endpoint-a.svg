<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" font-family="ui-sans-serif, system-ui, sans-serif">
  <rect width="1200" height="760" fill="#ffffff"/>
  <text x="60" y="70" font-size="30" font-weight="700" fill="#18181b">Alur satu request audit</text>
  <text x="60" y="102" font-size="15" fill="#71717a">Hanya admin yang boleh membaca, dan backend yang memeriksa.</text>

  <rect x="60" y="140" width="540" height="64" rx="10" fill="#eff6ff" stroke="#93c5fd" stroke-width="2"/>
  <text x="82" y="170" font-size="15" font-weight="700" fill="#0f172a">Browser</text>
  <text x="82" y="190" font-size="12" fill="#475569">GET /api/audit-logs</text>

  <rect x="60" y="232" width="540" height="64" rx="10" fill="#fffbeb" stroke="#fcd34d" stroke-width="2"/>
  <text x="82" y="262" font-size="15" font-weight="700" fill="#0f172a">authenticate</text>
  <text x="82" y="282" font-size="12" fill="#475569">baca cookie dan verifikasi sesi</text>

  <rect x="60" y="324" width="540" height="64" rx="10" fill="#fffbeb" stroke="#fcd34d" stroke-width="2"/>
  <text x="82" y="354" font-size="15" font-weight="700" fill="#0f172a">authorize admin</text>
  <text x="82" y="374" font-size="12" fill="#475569">cek role pengguna</text>

  <rect x="60" y="416" width="540" height="64" rx="10" fill="#ecfdf5" stroke="#6ee7b7" stroke-width="2"/>
  <text x="82" y="446" font-size="15" font-weight="700" fill="#0f172a">validasi query</text>
  <text x="82" y="466" font-size="12" fill="#475569">page, pageSize, action, target, tanggal</text>

  <rect x="60" y="508" width="540" height="64" rx="10" fill="#f5f3ff" stroke="#c4b5fd" stroke-width="2"/>
  <text x="82" y="538" font-size="15" font-weight="700" fill="#0f172a">repository</text>
  <text x="82" y="558" font-size="12" fill="#475569">SELECT dengan filter dan pagination</text>

  <rect x="60" y="600" width="540" height="64" rx="10" fill="#eff6ff" stroke="#93c5fd" stroke-width="2"/>
  <text x="82" y="630" font-size="15" font-weight="700" fill="#0f172a">respons</text>
  <text x="82" y="650" font-size="12" fill="#475569">items dan pagination</text>

  <line x1="330" y1="204" x2="330" y2="226" stroke="#94a3b8" stroke-width="2"/>
  <path d="M330 226 l-6 -11 h12 z" fill="#94a3b8"/>
  <line x1="330" y1="296" x2="330" y2="318" stroke="#94a3b8" stroke-width="2"/>
  <path d="M330 318 l-6 -11 h12 z" fill="#94a3b8"/>
  <line x1="330" y1="388" x2="330" y2="410" stroke="#94a3b8" stroke-width="2"/>
  <path d="M330 410 l-6 -11 h12 z" fill="#94a3b8"/>
  <line x1="330" y1="480" x2="330" y2="502" stroke="#94a3b8" stroke-width="2"/>
  <path d="M330 502 l-6 -11 h12 z" fill="#94a3b8"/>
  <line x1="330" y1="572" x2="330" y2="594" stroke="#94a3b8" stroke-width="2"/>
  <path d="M330 594 l-6 -11 h12 z" fill="#94a3b8"/>

  <line x1="600" y1="264" x2="700" y2="264" stroke="#f59e0b" stroke-width="2" stroke-dasharray="5 4"/>
  <line x1="600" y1="356" x2="700" y2="356" stroke="#f59e0b" stroke-width="2" stroke-dasharray="5 4"/>
  <line x1="600" y1="448" x2="700" y2="448" stroke="#f59e0b" stroke-width="2" stroke-dasharray="5 4"/>
  <line x1="600" y1="632" x2="700" y2="632" stroke="#16a34a" stroke-width="2" stroke-dasharray="5 4"/>

  <rect x="700" y="228" width="440" height="72" rx="10" fill="#fef2f2" stroke="#fca5a5" stroke-width="2"/>
  <text x="722" y="258" font-size="15" font-weight="700" fill="#b91c1c">401 tanpa sesi</text>
  <text x="722" y="280" font-size="12" fill="#475569">cookie tidak ada atau token tidak valid</text>

  <rect x="700" y="320" width="440" height="72" rx="10" fill="#fef2f2" stroke="#fca5a5" stroke-width="2"/>
  <text x="722" y="350" font-size="15" font-weight="700" fill="#b91c1c">403 bukan admin</text>
  <text x="722" y="372" font-size="12" fill="#475569">owner dan customer ditolak</text>

  <rect x="700" y="412" width="440" height="72" rx="10" fill="#fffbeb" stroke="#fcd34d" stroke-width="2"/>
  <text x="722" y="442" font-size="15" font-weight="700" fill="#92400e">400 query tidak valid</text>
  <text x="722" y="464" font-size="12" fill="#475569">parameter asing, tanggal salah, pageSize terlalu besar</text>

  <rect x="700" y="596" width="440" height="72" rx="10" fill="#ecfdf5" stroke="#6ee7b7" stroke-width="2"/>
  <text x="722" y="626" font-size="15" font-weight="700" fill="#15803d">200 data riwayat</text>
  <text x="722" y="648" font-size="12" fill="#475569">hanya untuk admin</text>

  <line x1="60" y1="696" x2="1140" y2="696" stroke="#e2e8f0" stroke-width="1"/>
  <text x="60" y="724" font-size="13" fill="#64748b">Menyembunyikan menu di frontend tidak cukup. Endpoint tetap bisa dipanggil langsung.</text>
</svg>
