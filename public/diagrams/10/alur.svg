<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" font-family="ui-sans-serif, system-ui, sans-serif">
  <rect width="1200" height="760" fill="#ffffff"/>
  <text x="60" y="70" font-size="30" font-weight="700" fill="#18181b">Dua tunnel, satu aplikasi lokal</text>
  <text x="60" y="102" font-size="15" fill="#71717a">ngrok memberi alamat HTTPS publik untuk port yang berjalan di laptop.</text>

  <rect x="60" y="240" width="230" height="150" rx="16" fill="#eff6ff" stroke="#93c5fd" stroke-width="2"/>
  <text x="84" y="282" font-size="17" font-weight="700" fill="#0f172a">Browser</text>
  <text x="84" y="308" font-size="13" fill="#475569">di mana saja</text>
  <text x="84" y="340" font-size="12" fill="#1d4ed8">https://xxx.ngrok-free.app</text>
  <text x="84" y="362" font-size="12" fill="#1d4ed8">https://yyy.ngrok-free.app</text>

  <rect x="370" y="180" width="330" height="290" rx="18" fill="#f5f3ff" stroke="#c4b5fd" stroke-width="2"/>
  <text x="396" y="220" font-size="19" font-weight="700" fill="#5b21b6">ngrok</text>
  <text x="396" y="244" font-size="13" fill="#475569">terowongan HTTPS</text>

  <rect x="396" y="270" width="278" height="72" rx="12" fill="#ffffff" stroke="#ddd6fe" stroke-width="2"/>
  <text x="414" y="300" font-size="14" font-weight="700" fill="#0f172a">frontend</text>
  <text x="414" y="322" font-size="12" fill="#475569">https://xxx... menuju port 5174</text>

  <rect x="396" y="356" width="278" height="72" rx="12" fill="#ffffff" stroke="#ddd6fe" stroke-width="2"/>
  <text x="414" y="386" font-size="14" font-weight="700" fill="#0f172a">backend</text>
  <text x="414" y="408" font-size="12" fill="#475569">https://yyy... menuju port 3002</text>

  <rect x="790" y="150" width="350" height="350" rx="18" fill="#f8fafc" stroke="#cbd5e1" stroke-width="2"/>
  <text x="816" y="190" font-size="19" font-weight="700" fill="#0f172a">Laptop</text>

  <rect x="816" y="215" width="298" height="66" rx="10" fill="#eff6ff" stroke="#93c5fd" stroke-width="1.5"/>
  <text x="834" y="242" font-size="14" font-weight="700" fill="#0f172a">Frontend Vite</text>
  <text x="834" y="264" font-size="12" fill="#475569">localhost:5174</text>

  <rect x="816" y="295" width="298" height="66" rx="10" fill="#ecfdf5" stroke="#6ee7b7" stroke-width="1.5"/>
  <text x="834" y="322" font-size="14" font-weight="700" fill="#0f172a">Backend Express</text>
  <text x="834" y="344" font-size="12" fill="#475569">localhost:3002</text>

  <rect x="816" y="375" width="298" height="66" rx="10" fill="#f5f3ff" stroke="#c4b5fd" stroke-width="1.5"/>
  <text x="834" y="402" font-size="14" font-weight="700" fill="#0f172a">SQL Server</text>
  <text x="834" y="424" font-size="12" fill="#475569">localhost:1433, tidak dibuka</text>

  <line x1="290" y1="315" x2="330" y2="315" stroke="#94a3b8" stroke-width="2"/>
  <path d="M330 315 l-11 -6 v12 z" fill="#94a3b8"/>
  <line x1="700" y1="315" x2="785" y2="315" stroke="#94a3b8" stroke-width="2"/>
  <path d="M785 315 l-11 -6 v12 z" fill="#94a3b8"/>

  <line x1="60" y1="570" x2="1140" y2="570" stroke="#e2e8f0" stroke-width="1"/>
  <text x="60" y="606" font-size="15" font-weight="700" fill="#0f172a">Hanya port aplikasi yang dibuka, database tetap di dalam.</text>
  <text x="60" y="632" font-size="13" fill="#64748b">URL berubah setiap ngrok dijalankan ulang, jadi env dan CORS perlu diperbarui.</text>
</svg>
