<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 744 880" font-family="ui-sans-serif, system-ui, sans-serif">
  <rect width="744" height="880" fill="#ffffff"/>
  <text x="32" y="62" font-size="30" font-weight="700" fill="#18181b">Alur CORS dan cookie</text>
  <text x="32" y="94" font-size="15" fill="#71717a">Dua alamat ngrok dianggap dua situs berbeda.</text>

  <text x="249" y="120" font-size="13" font-weight="600" fill="#475569" text-anchor="middle">Host</text>
  <text x="489" y="120" font-size="13" font-weight="600" fill="#475569" text-anchor="middle">Origin</text>

  <rect x="32" y="130" width="200" height="100" rx="12" fill="#f8fafc" stroke="#cbd5e1" stroke-width="2"/>
  <text x="52" y="167" font-size="16" font-weight="700" fill="#0f172a">Browser</text>
  <text x="52" y="194" font-size="13" fill="#475569">membuka halaman</text>
  <text x="52" y="214" font-size="13" fill="#1d4ed8">URL frontend</text>

  <rect x="272" y="130" width="200" height="100" rx="12" fill="#eff6ff" stroke="#93c5fd" stroke-width="2"/>
  <text x="292" y="167" font-size="16" font-weight="700" fill="#1d4ed8">Frontend</text>
  <text x="292" y="194" font-size="13" fill="#475569">URL ngrok A</text>
  <text x="292" y="214" font-size="13" fill="#64748b">periksa Host</text>

  <rect x="512" y="130" width="200" height="100" rx="12" fill="#ecfdf5" stroke="#6ee7b7" stroke-width="2"/>
  <text x="532" y="167" font-size="16" font-weight="700" fill="#15803d">Backend</text>
  <text x="532" y="194" font-size="13" fill="#475569">URL ngrok B</text>
  <text x="532" y="214" font-size="13" fill="#64748b">periksa origin</text>

  <line x1="234" y1="180" x2="264" y2="180" stroke="#94a3b8" stroke-width="2"/>
  <path d="M264 180 l-10 -5 v10 z" fill="#94a3b8"/>
  <line x1="474" y1="180" x2="504" y2="180" stroke="#94a3b8" stroke-width="2"/>
  <path d="M504 180 l-10 -5 v10 z" fill="#94a3b8"/>

  <line x1="504" y1="206" x2="474" y2="206" stroke="#f87171" stroke-width="2" stroke-dasharray="5 4"/>
  <path d="M474 206 l10 -5 v10 z" fill="#f87171"/>
  <text x="489" y="258" font-size="12" font-weight="600" fill="#b91c1c" text-anchor="middle">Set-Cookie</text>

  <rect x="32" y="280" width="680" height="170" rx="14" fill="#fffbeb" stroke="#fcd34d" stroke-width="2"/>
  <text x="56" y="320" font-size="20" font-weight="700" fill="#92400e">Host ditolak Vite</text>
  <text x="56" y="355" font-size="16" fill="#475569">Domain ngrok belum ada di allowedHosts.</text>
  <text x="56" y="383" font-size="16" fill="#475569">Vite menolak seluruh halaman sebelum tampil.</text>
  <text x="56" y="420" font-size="14" font-weight="600" fill="#b91c1c">Gejala: Blocked request.</text>

  <rect x="32" y="470" width="680" height="170" rx="14" fill="#fef2f2" stroke="#fca5a5" stroke-width="2"/>
  <text x="56" y="510" font-size="20" font-weight="700" fill="#b91c1c">Response diblokir CORS</text>
  <text x="56" y="545" font-size="16" fill="#475569">Origin halaman berbeda dari origin backend.</text>
  <text x="56" y="573" font-size="16" fill="#475569">Tanpa izin yang cocok, browser menahan response.</text>
  <text x="56" y="610" font-size="14" font-weight="600" fill="#b91c1c">Gejala: data tidak muncul.</text>

  <rect x="32" y="660" width="680" height="170" rx="14" fill="#eff6ff" stroke="#93c5fd" stroke-width="2"/>
  <text x="56" y="700" font-size="20" font-weight="700" fill="#1d4ed8">Cookie tidak terkirim</text>
  <text x="56" y="735" font-size="16" fill="#475569">SameSite=Lax tidak ikut pada request lintas situs.</text>
  <text x="56" y="763" font-size="16" fill="#475569">Cookie baru terkirim setelah diubah ke None.</text>
  <text x="56" y="800" font-size="14" font-weight="600" fill="#1d4ed8">Gejala: login lalu tetap 401.</text>

  <text x="32" y="858" font-size="14" fill="#64748b">Satu gerbang gagal saja, halaman tetap terbuka tetapi data tidak muncul.</text>
</svg>
